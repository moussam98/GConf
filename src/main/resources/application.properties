#PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5434/conferencedb
spring.datasource.username=postgres
spring.datasource.password=postgresDB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Jwt config
application.jwt.secret-key=s0ug5wdCMDkXuWIIfhWgOK/v1TxzMH6vdCQHvbICj/mJo/wuTRnJqO3hKm1aydzwJFu2l5Ryaq0rLmgJj3EqoA==
#15 minutes in milliseconds
application.jwt.token-expiration-in-milliseconds=900000
# 7 days in milliseconds
application.jwt.token-refresh-expiration-in-milliseconds=604800000

# Flyway configuration
spring.flyway.enabled=true

# hikari configuration
# Optimal pool sizing
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# Timeouts
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Leak detection
spring.datasource.hikari.leak-detection-threshold=5000
# Performance
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.pool-name=GConfConnectionPool